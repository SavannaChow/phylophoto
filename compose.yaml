services:
  phylogeny-photo-browser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phylophoto
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      PHYLOPHOTO_ROOT: /data/photos
    volumes:
      # Change the left side if your Synology photo path is different.
      - /volume1/docker/phylophoto/photos:/data/photos
