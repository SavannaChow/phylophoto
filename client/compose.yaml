services:
  phylophoto-client:
    build: .
    container_name: phylophoto-client
    restart: unless-stopped
    ports:
      - "8502:80"
    environment:
      PHYLOPHOTO_DATA_ROOT: /data
      PHYLOPHOTO_UPLOAD_ROOT: /data
      PHYLOPHOTO_ENABLE_EDITING: ${PHYLOPHOTO_ENABLE_EDITING:-0}
    volumes:
      - ${PHYLOPHOTO_DATA_PATH:-./data}:/data
